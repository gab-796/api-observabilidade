name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      # 1. Autenticar no Vault de produção
      - name: Get secrets from Vault
        uses: hashicorp/vault-action@v2
        with:
          url: https://vault.empresa.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secret/data/prod/mysql MYSQL_ROOT_PASSWORD | MYSQL_ROOT_PASSWORD ;
            secret/data/prod/mysql DB_PASSWORD | DB_PASSWORD
      
      # 2. Deploy usando as senhas do Vault
      - name: Deploy to Kubernetes
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          ./deploy.sh
