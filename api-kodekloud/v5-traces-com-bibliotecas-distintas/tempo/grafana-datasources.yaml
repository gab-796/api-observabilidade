apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    #url: http://tempo-container:3200 # Usando o nome do container do temo como `tempo-container`.
    url: http://tempo:3200 # Direto pelo service do tempo dentro do Docker.
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
    apiVersion: 1
    uid: tempo
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      streamingEnabled:
        search: false # Manter Falso para que o Grafana Use HTTP 1.1 e não dê erro. Caso queira true, opte pela url tempo-container:3200.
