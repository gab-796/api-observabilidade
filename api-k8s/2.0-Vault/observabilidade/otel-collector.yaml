apiVersion: v1
kind: Service
metadata:
  name: otel-collector-service
  namespace: api-app-go
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317 # Porta do receptor OTLP gRPC
      targetPort: 4317
      protocol: TCP
    - name: health
      port: 13133
      targetPort: 13133
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: api-app-go
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.123.0-amd64
          command:
            ["/otelcol-contrib", "--config=/conf/otel-collector-config.yaml"]
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT # Conforme configurado no main.go
              value: "tempo:4317" # Endereço do Tempo
            #- name: DD_API_KEY_GO_LAB # Configuração pra envio de trace pro DD
            #  valueFrom:
            #    secretKeyRef:
            #      name: datadog-api-key # Nome do Secret k8s
            #      key: DD_API_KEY_GO_LAB # Chave dentro do Secret
          ports:
            - containerPort: 4317 # Porta do receptor OTLP gRPC
              name: otlp-grpc
            - containerPort: 4318 # Porta do receptor OTLP HTTP (opcional)
              name: otlp-http
            - containerPort: 13133 # porta usada pelo healthcheck, liveness e readiness.
              name: health
          volumeMounts:
            - name: config-vol
              mountPath: /conf
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "0.5"
              memory: "128Mi"
          #livenessProbe:
          #  httpGet:
          #    path: /
          #    port: 13133 # Porta padrão do health check do coletor
          #  initialDelaySeconds: 75
          #  periodSeconds: 20
          #  failureThreshold: 5
          #  timeoutSeconds: 5
          #readinessProbe:
          #  httpGet:
          #    path: /
          #    port: 13133
          #  initialDelaySeconds: 50
          #  periodSeconds: 10
          #  failureThreshold: 5
          #  timeoutSeconds: 5
      volumes:
        - name: config-vol
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: api-app-go
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
      prometheus: # Configuração para coletar métricas da app
        config:
          scrape_configs:
            - job_name: 'inventory-app' # Métricas da app Go
              static_configs:
                - targets: ['inventory-app-metrics-service:2113'] # Nome correto do service
              scrape_interval: 15s
              metrics_path: /metrics
            # Self-monitoring do Mimir desabilitado - não necessário para este lab
            # - job_name: 'mimir-metrics'
            #   static_configs:
            #     - targets: ['mimir:9009'] # Métricas internas do Mimir
            #   scrape_interval: 30s
            #   metrics_path: /metrics

    processors:
      batch:

    exporters:
      otlp:
        endpoint: tempo:4317
        tls:
          insecure: true
      prometheusremotewrite: # Exporter para métricas
        endpoint: "http://mimir:9009/api/v1/push"

    extensions:
      health_check: {}

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: "warn"
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp]
        metrics: # Pipeline de métricas para o Mimir
          receivers: [prometheus]
          exporters: [prometheusremotewrite]
