# External Secrets Operator - Installation
# Instala o ESO via Helm para gerenciar secrets do Vault

# IMPORTANTE: Execute este comando ANTES de aplicar os outros manifestos:
# helm repo add external-secrets https://charts.external-secrets.io
# helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace

# Após a instalação do Helm chart, aplique os manifestos abaixo:
---
# SecretStore - Configura a conexão com o Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: api-app-go
spec:
  provider:
    vault:
      server: "http://vault.api-app-go.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        # Autenticação usando token (dev mode)
        tokenSecretRef:
          name: vault-token
          key: token
---
# Secret com o token do Vault (dev mode usa token "root")
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: api-app-go
type: Opaque
stringData:
  token: "root"
---
# ExternalSecret - Sincroniza secrets do Vault para Kubernetes Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-credentials
  namespace: api-app-go
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: mysql-secrets
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: inventory-app/database
        property: MYSQL_ROOT_PASSWORD
    - secretKey: DB_PASSWORD
      remoteRef:
        key: inventory-app/database
        property: DB_PASSWORD
