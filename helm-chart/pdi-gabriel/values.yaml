# ========================================
# GLOBAL CONFIGURATION
# ========================================
global:
  namespace: api-app-go
  environment: development

# ========================================
# COMMON LABELS AND ANNOTATIONS
# ========================================
commonLabels:
  project: api-observabilidade
  team: platform
  version: v1.0.0

commonAnnotations: {}

# ========================================
# SERVICE ACCOUNT CONFIGURATION
# ========================================
serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: true

# ========================================
# SERVICES CONFIGURATION
# ========================================
services:
  type: ClusterIP

# ========================================
# MONITORING AND HEALTH CHECKS
# ========================================
monitoring:
  healthChecks:
    enabled: true
    readinessProbe:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

# ========================================
# MYSQL DATABASE CONFIGURATION
# ========================================
mysql:
  enabled: true
  name: mysql
  replicaCount: 1
  port: 3306

  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent

  config:
    rootPassword: admin
    database: inventory
    user: root

  resources:
    limits:
      memory: "1Gi"
      cpu: "1000m"
    requests:
      memory: "512Mi"
      cpu: "500m"

# ========================================
# INVENTORY APPLICATION CONFIGURATION
# ========================================
inventoryApp:
  enabled: true
  name: inventory-app
  replicaCount: 1
  image:
    repository: gab796/inventory_app
    tag: v4.0
    pullPolicy: IfNotPresent
  ingress:
    enabled: true
    ingressClassName: nginx
    host: inventory.local
    exposeMetrics: true
    annotations: {}
    tls: false
  ports:
    http: 10000
    metrics: 2113

  # Application configuration
  config:
    logLevel: info
    ginMode: release
    additionalEnvVars: {}

  # Observability configuration
  observability:
    otel:
      protocol: grpc
    prometheus:
      metricsPath: /metrics

  # Secrets
  secret:
    dbPassword: "admin"  # Em produção, use Sealed Secrets ou External Secrets

  env: {}

  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "250m"

  # Autoscaling configuration
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 80

# ========================================
# GRAFANA CONFIGURATION
# ========================================
grafana:
  enabled: true
  name: grafana
  replicaCount: 1

  image:
    repository: grafana/grafana
    tag: "11.6.0"
    pullPolicy: IfNotPresent

  ports:
    http: 3000

  config:
    # ⚠️ ESCOLHA: Autenticação anônima OU login tradicional

    # OPÇÃO 1: Autenticação anônima (como seu arquivo original)
    auth:
      anonymous:
        enabled: true
        orgRole: "Admin"
        disableLoginForm: true
        disableSignoutMenu: true

    # OPÇÃO 2: Login tradicional (comentar se usar anônimo)
    # adminUser: admin
    # adminPassword: admin123

    # Configurações gerais
    logLevel: warn
    rootUrl: "http://grafana-web.local"

    users:
      allowSignUp: false

    # Features e plugins (como seu arquivo original)
    featureToggles: "traceqlEditor,metricsSummary"

    plugins:
      install: "https://storage.googleapis.com/integration-artifacts/grafana-exploretraces-app/grafana-exploretraces-app-latest.zip;grafana-traces-app"

  # Data sources configuration (compatível com seu ConfigMap)
  datasources:
    tempo:
      enabled: true
      url: http://tempo:3200
      isDefault: true

    loki:
      enabled: true
      url: http://loki:3100
      maxLines: 1000

    pyroscope:
      enabled: true
      url: http://pyroscope:4040

    mimir:
      enabled: true
      url: http://mimir:9009/prometheus

  # Ingress configuration
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      grafana: grafana-web.local
    exposeStack: false
    annotations: {}
    tls: []

  # Dashboards configuration
  dashboards:
    inventory:
      enabled: true
      title: "API Inventory - Observability Dashboard"
      folder: "API Inventory"

  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "250m"

  # Persistence (para manter dashboards, plugins instalados, etc.)
  persistence:
    enabled: false
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClass: ""  # Use uma StorageClass válida do cluster ou deixe vazio

  # Modo efêmero (dev): garante que o banco (grafana.db) seja recriado a cada start
  ephemeral:
    enabled: true      # Se true, ignora PVC (usa emptyDir) e roda initContainer limpando grafana.db
    resetDb: true      # Se false, apenas não persiste; se true força remoção explícita do arquivo

# ========================================
# GRAFANA ALLOY CONFIGURATION
# ========================================

alloy:
  enabled: true
  name: alloy
  replicaCount: 1
  stabilityLevel: "public-preview" # Permite usar o pyroscope.receive_http

  image:
    repository: grafana/alloy
    tag: v1.9.1
    pullPolicy: IfNotPresent

  ports:
    http: 12345
    profiling: 4040   # Porta separada para o receiver pyroscope (evita conflito com HTTP interno do Alloy)

  config:
    logging:
      level: info
      format: json

  securityContext:
    runAsNonRoot: true
    runAsUser: 473
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      memory: "256Mi"
      cpu: "200m"
    requests:
      memory: "128Mi"
      cpu: "100m"

# ========================================
# OPENTELEMETRY COLLECTOR CONFIGURATION
# ========================================
otelCollector:
  enabled: true
  name: otel-collector
  replicaCount: 1

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.123.0-amd64"  # Mesma versão do seu manifesto
    pullPolicy: IfNotPresent

  ports:
    otlpGrpc: 4317
    otlpHttp: 4318
    healthCheck: 13133  # Mesma porta do seu manifesto

  config:
    logging:
      level: warn  # Mesmo nível do seu manifesto

    prometheus:
      scrapeInterval: 15s
      scrapeMimir: true
      mimirScrapeInterval: 30s

    datadog:
      enabled: false  # Para controlar a configuração comentada do DD

  resources:
    limits:
      memory: "1Gi"    # Mesmos recursos do seu manifesto
      cpu: "1000m"
    requests:
      memory: "128Mi"
      cpu: "500m"

# ========================================
# GRAFANA TEMPO CONFIGURATION (TRACES)
# ========================================
tempo:
  enabled: true
  name: tempo
  replicaCount: 1

  image:
    repository: grafana/tempo
    tag: "2.6.0"
    pullPolicy: IfNotPresent

  ports:
    http: 3200
    otlpGrpc: 4317
    otlpHttp: 4318
    grpc: 9095

  config:
    server:
      logLevel: warn
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo

  resources:
    limits:
      memory: "1Gi"
      cpu: "1000m"
    requests:
      memory: "512Mi"
      cpu: "500m"

# ========================================
# GRAFANA LOKI CONFIGURATION (LOGS)
# ========================================
loki:
  enabled: true
  name: loki
  replicaCount: 1

  image:
    repository: grafana/loki
    tag: "2.9.5"
    pullPolicy: IfNotPresent

  ports:
    http: 3100
    grpc: 9095

  config:
    authEnabled: false
    server:
      logLevel: warn
    storage:
      type: filesystem
      filesystem:
        chunksDirectory: /loki/chunks
        rulesDirectory: /loki/rules

  # Configuração de persistência específica para Loki
  persistence:
    enabled: false
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  resources:
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "256Mi"
      cpu: "250m"

# ========================================
# GRAFANA MIMIR CONFIGURATION (METRICS)
# ========================================
mimir:
  enabled: true
  name: mimir
  replicaCount: 1

  image:
    repository: grafana/mimir
    tag: "2.13.0"
    pullPolicy: IfNotPresent

  ports:
    http: 8080
    grpc: 9095

  config:
    multitenancyEnabled: false
    internalMetricsPort: 9009      # Porta para métricas internas
    remoteWritePort: 9009          # Porta para remote write (conforme seu manifesto)
    server:
      logLevel: warn
    storage:
      backend: filesystem
      filesystem:
        dir: /data/blocks
        rulerDir: /data/ruler
    ingester:
      replicationFactor: 1
      outOfOrderTimeWindow: 10m    # Aceitar samples até 10 minutos fora de ordem
    limits:
      maxGlobalSeriesPerUser: 10000000
      ingestionRate: 100000
      outOfOrderTimeWindow: 10m

  resources:
    limits:
      memory: "2Gi"
      cpu: "1000m"
    requests:
      memory: "1Gi"
      cpu: "500m"

# ========================================
# GRAFANA PYROSCOPE CONFIGURATION (PROFILING)
# ========================================
pyroscope:
  enabled: true
  name: pyroscope
  replicaCount: 1

  image:
    repository: grafana/pyroscope
    tag: "1.13.0"
    pullPolicy: IfNotPresent

  ports:
    http: 4040
    grpc: 4041

  config:
    server:
      logLevel: warn
    storage:
      backend: filesystem
      filesystem:
        path: /var/lib/pyroscope

  resources:
    limits:
      memory: "1Gi"
      cpu: "1000m"
    requests:
      memory: "512Mi"
      cpu: "500m"

# ========================================
# INGRESS CONFIGURATION
# ========================================
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: grafana.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: grafana
            port: 3000
  tls: []

# ========================================
# PERSISTENCE (OPCIONAL)
# ========================================
persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size:
    mysql: 1Gi
    grafana: 1Gi
    loki: 1Gi
    mimir: 1Gi
    tempo: 1Gi
    pyroscope: 1Gi

# ========================================
# SECURITY CONFIGURATION
# ========================================
podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# ========================================
# NODE SELECTOR, AFFINITY, TOLERATIONS
# ========================================
nodeSelector: {}

tolerations: []

affinity: {}

# ========================================
# AUTOSCALING (OPCIONAL)
# ========================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 80

# ========================================
# NETWORK POLICIES (OPCIONAL)
# ========================================
networkPolicy:
  enabled: false

# ========================================
# SERVICE MONITOR FOR PROMETHEUS OPERATOR (OPCIONAL)
# ========================================
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s

# ========================================
# ADDITIONAL CONFIGURATION
# ========================================
nameOverride: ""
fullnameOverride: ""

# Extra environment variables for all deployments
extraEnvVars: []

# Extra volumes and volume mounts for all deployments
extraVolumes: []
extraVolumeMounts: []

# Pod annotations
podAnnotations: {}

# Deployment strategy
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 1