{{- if .Values.grafana.enabled }}
#############################################
# GRAFANA CONFIGMAP (configs)               #
#############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.grafana.name }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.grafana.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  grafana.ini: |
    [server]
    root_url = {{ .Values.grafana.config.rootUrl | default "http://grafana-web.local" }}
    [auth]
    disable_login_form = {{ .Values.grafana.config.auth.anonymous.disableLoginForm }}
    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/inventory-dashboard.json

  provisioning-dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: '{{ .Values.grafana.dashboards.inventory.folder }}'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
#############################################
# GRAFANA DEPLOYMENT                       #
#############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.grafana.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.grafana.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.grafana.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.grafana.name }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ (printf "%s|%s" (.Values.grafana.config | toJson) (.Values.grafana.dashboards | toJson)) | sha256sum }}
        checksum/datasources: {{ (.Values.grafana.datasources | toJson) | sha256sum }}
        checksum/dashboard: {{ include (print $.Template.BasePath "/grafana-dashboard-inventory.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Values.grafana.name }}
          image: {{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}
          ports:
            - containerPort: {{ .Values.grafana.ports.http }}
          env:
            {{- if .Values.grafana.config.auth.anonymous.enabled }}
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: {{ .Values.grafana.config.auth.anonymous.enabled | quote }}
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: {{ .Values.grafana.config.auth.anonymous.orgRole | quote }}
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: {{ .Values.grafana.config.auth.anonymous.disableLoginForm | quote }}
            - name: GF_AUTH_DISABLE_SIGNOUT_MENU
              value: {{ .Values.grafana.config.auth.anonymous.disableSignoutMenu | quote }}
            {{- else }}
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.grafana.config.adminUser | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.grafana.config.adminPassword | quote }}
            {{- end }}
            - name: GF_LOG_LEVEL
              value: {{ .Values.grafana.config.logLevel | quote }}
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: {{ .Values.grafana.config.featureToggles | quote }}
            {{- if .Values.grafana.config.plugins.install }}
            - name: GF_INSTALL_PLUGINS
              value: {{ .Values.grafana.config.plugins.install | quote }}
            {{- end }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: {{ .Values.grafana.config.users.allowSignUp | quote }}
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            # Monta arquivos individuais da ConfigMap nos caminhos esperados pelo Grafana
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: grafana-provisioning-dash
              mountPath: /etc/grafana/provisioning/dashboards/provisioning-dashboards.yaml
              subPath: provisioning-dashboards.yaml
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboard-inventory
              mountPath: /var/lib/grafana/dashboards
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          {{- if .Values.monitoring.healthChecks.enabled }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.grafana.ports.http }}
            {{- toYaml .Values.monitoring.healthChecks.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.grafana.ports.http }}
            {{- toYaml .Values.monitoring.healthChecks.readinessProbe | nindent 12 }}
          {{- end }}
      volumes:
        - name: grafana-storage
          {{- if and .Values.grafana.persistence.enabled (not .Values.grafana.ephemeral.enabled) }}
          persistentVolumeClaim:
            claimName: {{ .Values.grafana.name }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: grafana-config
          configMap:
            name: {{ .Values.grafana.name }}-config
        - name: grafana-provisioning-dash
          configMap:
            name: {{ .Values.grafana.name }}-config
        - name: grafana-datasources
          configMap:
            name: {{ .Values.grafana.name }}-datasources
        - name: dashboard-inventory
          configMap:
            name: grafana-dashboard-inventory

---
#############################################
# GRAFANA SERVICE                          #
#############################################
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.grafana.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.grafana.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - port: {{ .Values.grafana.ports.http }}
      targetPort: {{ .Values.grafana.ports.http }}
  selector:
    app: {{ .Values.grafana.name }}
  type: {{ .Values.services.type }}

{{- if .Values.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.grafana.name }}-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.grafana.name }}
spec:
  accessModes:
    {{- range .Values.grafana.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size | default "5Gi" | quote }}
  {{- if .Values.grafana.persistence.storageClass }}
  {{- if (eq "-" .Values.grafana.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: "{{ .Values.grafana.persistence.storageClass }}"
  {{- end }}
  {{- end }}
{{- end }}

{{- end }}

{{/* InitContainer para modo efêmero resetar banco */}}
{{- if and .Values.grafana.enabled .Values.grafana.ephemeral.enabled .Values.grafana.ephemeral.resetDb }}
{{- /* Patch Deployment via strategic merge usando annotation extra seria ideal; aqui simplificamos com segunda renderização não intrusiva se necessário */}}
{{- end }}

