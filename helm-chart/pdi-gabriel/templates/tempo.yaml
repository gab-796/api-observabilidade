{{- if .Values.tempo.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.tempo.name }}-config
  namespace: {{ .Values.global.namespace }}
data:
  tempo.yaml: |
    auth_enabled: false
    
    server:
      http_listen_port: {{ .Values.tempo.ports.http }}
      log_level: {{ .Values.tempo.config.server.logLevel }}

    # Configuração de multitenancy para single-tenant
    multitenancy_enabled: false

    # Configuração do distributor
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:{{ .Values.tempo.ports.otlpGrpc }}
            http:
              endpoint: 0.0.0.0:{{ .Values.tempo.ports.otlpHttp }}

    # Configuração do ingester  
    ingester:
      trace_idle_period: 10s
      max_block_bytes: 5242880
      max_block_duration: 5m

    # Configuração do compactor
    compactor:
      compaction:
        block_retention: 24h

    # Configuração do metrics-generator (resolve "empty ring")
    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: {{ .Values.global.namespace }}
      storage:
        path: {{ .Values.tempo.config.storage.trace.local.path }}/generator/wal
        remote_write:
          - url: http://{{ .Values.mimir.name }}:{{ .Values.mimir.config.remoteWritePort }}/api/v1/push
            send_exemplars: true

    # Configuração do memberlist (para cluster ring)  
    memberlist:
      node_name: tempo-0
      bind_port: 7946
      join_members: []

    # Configuração de storage
    storage:
      trace:
        backend: {{ .Values.tempo.config.storage.trace.backend }}
        local:
          path: {{ .Values.tempo.config.storage.trace.local.path }}
        wal:
          path: {{ .Values.tempo.config.storage.trace.local.path }}/wal

    # Configuração do query-frontend
    query_frontend:
      search:
        duration_slo: 5s
        throughput_bytes_slo: 1.073741824e+09
      trace_by_id:
        duration_slo: 5s

    # Configuração do querier
    querier:
      frontend_worker:
        frontend_address: {{ .Values.tempo.name }}:{{ .Values.tempo.ports.grpc }}

    # Configuração global de limites
    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.tempo.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.tempo.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.tempo.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.tempo.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.tempo.name }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: {{ .Values.tempo.name }}
          image: {{ .Values.tempo.image.repository }}:{{ .Values.tempo.image.tag }}
          imagePullPolicy: {{ .Values.tempo.image.pullPolicy }}
          args:
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - containerPort: {{ .Values.tempo.ports.http }}
              name: http
            - containerPort: {{ .Values.tempo.ports.otlpGrpc }}
              name: otlp-grpc
            - containerPort: {{ .Values.tempo.ports.otlpHttp }}
              name: otlp-http
            - containerPort: 9095
              name: grpc
            - containerPort: 7946
              name: memberlist
          volumeMounts:
            - name: tempo-storage
              mountPath: /var/tempo
            - name: tempo-config
              mountPath: /etc/tempo
              readOnly: true
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          {{- if .Values.monitoring.healthChecks.enabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.tempo.ports.http }}
            {{- toYaml .Values.monitoring.healthChecks.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.tempo.ports.http }}
            {{- toYaml .Values.monitoring.healthChecks.livenessProbe | nindent 12 }}
          {{- end }}
      volumes:
        - name: tempo-storage
          hostPath:
            path: /tmp/tempo-data
            type: DirectoryOrCreate
        - name: tempo-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.tempo.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.tempo.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.tempo.ports.http }}
      targetPort: {{ .Values.tempo.ports.http }}
    - name: otlp-grpc
      protocol: TCP
      port: {{ .Values.tempo.ports.otlpGrpc }}
      targetPort: {{ .Values.tempo.ports.otlpGrpc }}
    - name: otlp-http
      protocol: TCP
      port: {{ .Values.tempo.ports.otlpHttp }}
      targetPort: {{ .Values.tempo.ports.otlpHttp }}
    - name: grpc
      protocol: TCP
      port: 9095
      targetPort: 9095
    - name: memberlist
      protocol: TCP
      port: 7946
      targetPort: 7946
  selector:
    app: {{ .Values.tempo.name }}
  type: {{ .Values.services.type }}
{{- end }}