{{- if .Values.alloy.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.alloy.name }}
  namespace: {{ .Values.global.namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.alloy.name }}
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/stats
      - nodes/metrics
      - services
      - endpoints
      - pods
      - pods/log
      - pods/status
      - configmaps
      - secrets
      - namespaces
      - events
      - persistentvolumes
      - persistentvolumeclaims
      - componentstatuses
    verbs: ["get", "list", "watch"]
  
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  
  # Networking resources
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  
  # Autoscaling resources
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  
  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  
  # Storage resources
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]
  
  # RBAC resources (para monitorar permissões)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  
  # Policy resources
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  
  # Coordination resources (para leader election se necessário)
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch"]
  
  # Metrics and monitoring endpoints
  - nonResourceURLs: 
      - "/metrics"
      - "/metrics/cadvisor"
      - "/metrics/resource"
      - "/metrics/probes"
      - "/api/v1/nodes/*/proxy/metrics"
      - "/api/v1/nodes/*/proxy/metrics/cadvisor"
      - "/api/v1/nodes/*/proxy/metrics/resource"
      - "/api/v1/nodes/*/proxy/metrics/probes"
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.alloy.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.alloy.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.alloy.name }}
    namespace: {{ .Values.global.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.alloy.name }}-config
  namespace: {{ .Values.global.namespace }}
data:
  alloy.yaml: |
    logging {
      level  = "{{ .Values.alloy.config.logging.level }}"
      format = "{{ .Values.alloy.config.logging.format }}"
    }

    {{- if eq .Values.alloy.deploymentType "daemonset" }}
    // ========================================
    // NODE EXPORTER CONFIGURATION (DaemonSet)
    // ========================================
    // Quando rodando como DaemonSet com hostVolumes, o Alloy pode
    // coletar métricas similares ao node-exporter diretamente do host.
    // Exemplo de configuração adicional:
    
    // prometheus.exporter.unix "node" {
    //   procfs_path = "/host/proc"
    //   sysfs_path  = "/host/sys"
    //   rootfs_path = "/host/rootfs"
    // }
    
    // prometheus.scrape "node_metrics" {
    //   targets    = prometheus.exporter.unix.node.targets
    //   forward_to = [prometheus.remote_write.mimir.receiver]
    // }
    {{- end }}

    // Descoberta de pods Kubernetes para logs
    discovery.kubernetes "pods" {
      role = "pod"
      {{- if not .Values.alloy.config.logs.allNamespaces }}
      namespaces {
        names = ["{{ .Values.global.namespace }}"]
      }
      {{- end }}
    }

    // Adicionar labels dos metadados do Kubernetes
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        target_label = "job"
        replacement = "kubernetes-pods"
      }

      // Garantir que pods sem label app tenham service baseado no nome do container
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "service"
        regex = "(.+)"
        replacement = "${1}"
      }
    }

    // Coleta de logs dos pods Kubernetes
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.add_labels.receiver]
    }

    // Processar logs para preservar JSON original e adicionar apenas labels essenciais
    loki.process "add_labels" {
      forward_to = [loki.write.loki.receiver]

      // Extrair level dos logs JSON se disponível
      stage.json {
        expressions = {
          level_value = "level",
        }
      }

      // Apenas level como label (baixa cardinalidade)
      stage.labels {
        values = {
          level = "level_value",
        }
      }

      // Preservar timestamp original
      stage.timestamp {
        source = "time"
        format = "RFC3339"
      }
    }

    // Write para Loki (logs)
    loki.write "loki" {
      endpoint {
        url = "http://{{ .Values.loki.name }}:{{ .Values.loki.ports.http }}/loki/api/v1/push"
      }
    }

    // Receiver para profiling via push
    pyroscope.receive_http "default" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = {{ .Values.alloy.ports.profiling | default 4040 }}
      }
      forward_to = [pyroscope.write.pyroscope.receiver]
    }

    // Write para Pyroscope (profiling)
    pyroscope.write "pyroscope" {
      endpoint {
        url = "http://{{ .Values.pyroscope.name }}:{{ .Values.pyroscope.ports.http }}"
      }
    }
---
{{- if eq .Values.alloy.controller.type "daemonset" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.alloy.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alloy.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.alloy.name }}
  template:
{{- else if eq .Values.alloy.controller.type "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.alloy.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alloy.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.alloy.replicaCount }}
  serviceName: {{ .Values.alloy.name }}
  selector:
    matchLabels:
      app: {{ .Values.alloy.name }}
  template:
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.alloy.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alloy.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.alloy.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.alloy.name }}
  template:
{{- end }}
    metadata:
      labels:
        app: {{ .Values.alloy.name }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.alloy.name }}
      {{- if eq .Values.alloy.controller.type "daemonset" }}
      # 🔥 Configurações específicas para DaemonSet (seguindo estrutura oficial Grafana Alloy)
      hostNetwork: {{ .Values.alloy.controller.hostNetwork | default false }}
      hostPID: {{ .Values.alloy.controller.hostPID | default false }}
      dnsPolicy: {{ .Values.alloy.controller.dnsPolicy | default "ClusterFirst" }}
      {{- if .Values.alloy.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.alloy.controller.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.alloy.controller.tolerations }}
      tolerations:
        {{- toYaml .Values.alloy.controller.tolerations | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.alloy.name }}
          image: {{ .Values.alloy.image.repository }}:{{ .Values.alloy.image.tag }}
          imagePullPolicy: {{ .Values.alloy.image.pullPolicy }}
          args:
            - run
            - /etc/alloy/alloy.yaml
            - --storage.path=/var/lib/alloy/data
            {{- if .Values.alloy.stabilityLevel }}
            - --stability.level={{ .Values.alloy.stabilityLevel }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.alloy.ports.http }}
              name: http-metrics
            - containerPort: {{ .Values.alloy.ports.profiling | default 4040 }}
              name: profiling
          volumeMounts:
            - name: alloy-storage
              mountPath: /var/lib/alloy/data
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true
            {{- if eq .Values.alloy.controller.type "daemonset" }}
            # Volume mounts específicos para DaemonSet (coleta de métricas de host)
            {{- if .Values.alloy.daemonset.hostVolumes.proc.enabled }}
            - name: proc
              mountPath: /host/proc
              readOnly: true
            {{- end }}
            {{- if .Values.alloy.daemonset.hostVolumes.sys.enabled }}
            - name: sys
              mountPath: /host/sys
              readOnly: true
            {{- end }}
            {{- if .Values.alloy.daemonset.hostVolumes.rootfs.enabled }}
            - name: rootfs
              mountPath: /host/rootfs
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          securityContext:
            {{- if eq .Values.alloy.deploymentType "daemonset" }}
            # SecurityContext para DaemonSet (precisa de mais permissões)
            runAsNonRoot: false
            runAsUser: 0  # Root necessário para acessar /proc, /sys no host
            privileged: {{ .Values.alloy.daemonset.privileged | default false }}
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_PTRACE  # Para ler /proc
                - SYS_ADMIN   # Para métricas de sistema
                - DAC_READ_SEARCH  # Para ler arquivos do sistema
              drop:
                - NET_RAW
            {{- else }}
            # SecurityContext padrão para Deployment
            runAsNonRoot: {{ .Values.alloy.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.alloy.securityContext.runAsUser }}
            allowPrivilegeEscalation: {{ .Values.alloy.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                {{- toYaml .Values.alloy.securityContext.capabilities.drop | nindent 16 }}
            {{- end }}
      volumes:
        - name: alloy-storage
          {{- if eq .Values.alloy.deploymentType "daemonset" }}
          hostPath:
            path: /var/lib/alloy/data
            type: DirectoryOrCreate
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: alloy-config
          configMap:
            name: {{ .Values.alloy.name }}-config
        {{- if eq .Values.alloy.deploymentType "daemonset" }}
        # Volumes de host para coleta de métricas de sistema
        {{- if .Values.alloy.daemonset.hostVolumes.proc.enabled }}
        - name: proc
          hostPath:
            path: /proc
        {{- end }}
        {{- if .Values.alloy.daemonset.hostVolumes.sys.enabled }}
        - name: sys
          hostPath:
            path: /sys
        {{- end }}
        {{- if .Values.alloy.daemonset.hostVolumes.rootfs.enabled }}
        - name: rootfs
          hostPath:
            path: /
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.alloy.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alloy.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: http-metrics
      protocol: TCP
      port: {{ .Values.alloy.ports.http }}
      targetPort: {{ .Values.alloy.ports.http }}
    - name: profiling
      protocol: TCP
      port: {{ .Values.alloy.ports.profiling | default 4040 }}
      targetPort: {{ .Values.alloy.ports.profiling | default 4040 }}
  selector:
    app: {{ .Values.alloy.name }}
{{- end }}