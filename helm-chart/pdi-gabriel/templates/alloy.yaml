{{- if .Values.alloy.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.alloy.name }}
  namespace: {{ .Values.global.namespace }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.alloy.name }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
      - pods/log
      - ingresses
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.alloy.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.alloy.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.alloy.name }}
    namespace: {{ .Values.global.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.alloy.name }}-config
  namespace: {{ .Values.global.namespace }}
data:
  alloy.yaml: |
    logging {
      level  = "{{ .Values.alloy.config.logging.level }}"
      format = "{{ .Values.alloy.config.logging.format }}"
    }

    // Descoberta de pods Kubernetes para logs
    discovery.kubernetes "pods" {
      role = "pod"
      {{- if .Values.alloy.config.logs.allNamespaces }}
      // Coleta logs de todos os namespaces do cluster
      {{- else }}
      namespaces {
        names = ["{{ .Values.global.namespace }}"]
      }
      {{- end }}
    }

    // Adicionar labels dos metadados do Kubernetes
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        target_label = "job"
        replacement = "kubernetes-pods"
      }

      // Garantir que pods sem label app tenham service baseado no nome do container
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "service"
        regex = "(.+)"
        replacement = "${1}"
      }
    }

    // Coleta de logs dos pods Kubernetes
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.add_labels.receiver]
    }

    // Processar logs para preservar JSON original e adicionar apenas labels essenciais
    loki.process "add_labels" {
      forward_to = [loki.write.loki.receiver]

      // Extrair level dos logs JSON se disponível
      stage.json {
        expressions = {
          level_value = "level",
        }
      }

      // Apenas level como label (baixa cardinalidade)
      stage.labels {
        values = {
          level = "level_value",
        }
      }

      // Preservar timestamp original
      stage.timestamp {
        source = "time"
        format = "RFC3339"
      }
    }

    // Write para Loki (logs)
    loki.write "loki" {
      endpoint {
        url = "http://{{ .Values.loki.name }}:{{ .Values.loki.ports.http }}/loki/api/v1/push"
      }
    }

    // Receiver para profiling via push
    pyroscope.receive_http "default" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = {{ .Values.alloy.ports.profiling | default 4040 }}
      }
      forward_to = [pyroscope.write.pyroscope.receiver]
    }

    // Write para Pyroscope (profiling)
    pyroscope.write "pyroscope" {
      endpoint {
        url = "http://{{ .Values.pyroscope.name }}:{{ .Values.pyroscope.ports.http }}"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.alloy.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alloy.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.alloy.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.alloy.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.alloy.name }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.alloy.name }}
      containers:
        - name: {{ .Values.alloy.name }}
          image: {{ .Values.alloy.image.repository }}:{{ .Values.alloy.image.tag }}
          imagePullPolicy: {{ .Values.alloy.image.pullPolicy }}
          args:
            - run
            - /etc/alloy/alloy.yaml
            - --storage.path=/var/lib/alloy/data
            {{- if .Values.alloy.stabilityLevel }}
            - --stability.level={{ .Values.alloy.stabilityLevel }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.alloy.ports.http }}
              name: http-metrics
            - containerPort: {{ .Values.alloy.ports.profiling | default 4040 }}
              name: profiling
          volumeMounts:
            - name: alloy-storage
              mountPath: /var/lib/alloy/data
            - name: alloy-config
              mountPath: /etc/alloy
              readOnly: true
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: {{ .Values.alloy.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.alloy.securityContext.runAsUser }}
            allowPrivilegeEscalation: {{ .Values.alloy.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                {{- toYaml .Values.alloy.securityContext.capabilities.drop | nindent 16 }}
      volumes:
        - name: alloy-storage
          emptyDir: {}
        - name: alloy-config
          configMap:
            name: {{ .Values.alloy.name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.alloy.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.alloy.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: http-metrics
      protocol: TCP
      port: {{ .Values.alloy.ports.http }}
      targetPort: {{ .Values.alloy.ports.http }}
    - name: profiling
      protocol: TCP
      port: {{ .Values.alloy.ports.profiling | default 4040 }}
      targetPort: {{ .Values.alloy.ports.profiling | default 4040 }}
  selector:
    app: {{ .Values.alloy.name }}
{{- end }}