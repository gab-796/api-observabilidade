{{- if .Values.pyroscope.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.pyroscope.name }}-config
  namespace: {{ .Values.global.namespace }}
data:
  config.yaml: |
    server:
      http_listen_port: {{ .Values.pyroscope.ports.http }}
      grpc_listen_port: {{ .Values.pyroscope.ports.grpc }}
      log_level: {{ .Values.pyroscope.config.server.logLevel }}

    memberlist:
      bind_port: 7946
      join_members: []

    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist

    distributor:
      ring:
        kvstore:
          store: memberlist

    storage:
      backend: {{ .Values.pyroscope.config.storage.backend }}
      filesystem:
        dir: {{ .Values.pyroscope.config.storage.filesystem.path }}

    limits: {}
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.pyroscope.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.pyroscope.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.pyroscope.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.pyroscope.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.pyroscope.name }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: {{ .Values.pyroscope.name }}
          image: {{ .Values.pyroscope.image.repository }}:{{ .Values.pyroscope.image.tag }}
          imagePullPolicy: {{ .Values.pyroscope.image.pullPolicy }}
          args:
            - -config.file=/etc/pyroscope/config.yaml
            - -log.level={{ .Values.pyroscope.config.server.logLevel }}
          ports:
            - containerPort: {{ .Values.pyroscope.ports.http }}
              name: http
            - containerPort: {{ .Values.pyroscope.ports.grpc }}
              name: grpc
            - containerPort: 7946
              name: memberlist
          volumeMounts:
            - name: pyroscope-storage
              mountPath: {{ .Values.pyroscope.config.storage.filesystem.path }}
            - name: pyroscope-config
              mountPath: /etc/pyroscope
              readOnly: true
          resources:
            {{- toYaml .Values.pyroscope.resources | nindent 12 }}
          {{- if .Values.monitoring.healthChecks.enabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.pyroscope.ports.http }}
            {{- toYaml .Values.monitoring.healthChecks.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.pyroscope.ports.http }}
            {{- toYaml .Values.monitoring.healthChecks.livenessProbe | nindent 12 }}
          {{- end }}
      volumes:
        - name: pyroscope-storage
          emptyDir: {}
        - name: pyroscope-config
          configMap:
            name: {{ .Values.pyroscope.name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.pyroscope.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.pyroscope.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.pyroscope.ports.http }}
      targetPort: {{ .Values.pyroscope.ports.http }}
    - name: grpc
      protocol: TCP
      port: {{ .Values.pyroscope.ports.grpc }}
      targetPort: {{ .Values.pyroscope.ports.grpc }}
    - name: memberlist
      protocol: TCP
      port: 7946
      targetPort: 7946
  selector:
    app: {{ .Values.pyroscope.name }}
  type: {{ .Values.services.type }}
{{- end }}