{{- if .Values.loki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.loki.name }}-config
  namespace: {{ .Values.global.namespace }}
data:
  config.yaml: |
    auth_enabled: {{ .Values.loki.config.authEnabled }}

    server:
      http_listen_port: {{ .Values.loki.ports.http }}
      log_level: {{ .Values.loki.config.server.logLevel }}

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: {{ .Values.loki.config.storage.filesystem.chunksDirectory }}
          rules_directory: {{ .Values.loki.config.storage.filesystem.rulesDirectory }}
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: {{ .Values.loki.config.storage.type }}
          schema: v11
          index:
            prefix: index_
            period: 24h

    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        cache_location: /loki/boltdb-shipper-cache
        shared_store: {{ .Values.loki.config.storage.type }}
      filesystem:
        directory: {{ .Values.loki.config.storage.filesystem.chunksDirectory }}

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_cache_freshness_per_query: 10m
      split_queries_by_interval: 15m

    chunk_store_config:
      max_look_back_period: 0s

    table_manager:
      retention_deletes_enabled: false
      retention_period: 0s

    ruler:
      storage:
        type: local
        local:
          directory: {{ .Values.loki.config.storage.filesystem.rulesDirectory }}
      rule_path: /loki/rules-temp
      alertmanager_url: http://localhost:9093
      ring:
        kvstore:
          store: inmemory
      enable_api: true
---
{{- if .Values.loki.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.loki.name }}-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.loki.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- range .Values.loki.persistence.accessModes }}
    - {{ . | quote }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.loki.persistence.size | quote }}
  {{- if .Values.loki.persistence.storageClass }}
  {{- if (eq "-" .Values.loki.persistence.storageClass) }}
  storageClassName: ""
  {{- else }}
  storageClassName: "{{ .Values.loki.persistence.storageClass }}"
  {{- end }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.loki.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.loki.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.loki.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.loki.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.loki.name }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Values.loki.name }}
          image: {{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}
          imagePullPolicy: {{ .Values.loki.image.pullPolicy }}
          args:
            - -config.file=/etc/loki/config.yaml
            - -log.level={{ .Values.loki.config.server.logLevel }}
          ports:
            - containerPort: {{ .Values.loki.ports.http }}
              name: http
            - containerPort: {{ .Values.loki.ports.grpc }}
              name: grpc
          volumeMounts:
            - name: loki-storage
              mountPath: /loki
            - name: loki-config
              mountPath: /etc/loki
              readOnly: true
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          {{- if .Values.monitoring.healthChecks.enabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.loki.ports.http }}
            {{- toYaml .Values.monitoring.healthChecks.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.loki.ports.http }}
            {{- toYaml .Values.monitoring.healthChecks.livenessProbe | nindent 12 }}
          {{- end }}
      volumes:
        - name: loki-storage
          {{- if .Values.loki.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.loki.name }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: loki-config
          configMap:
            name: {{ .Values.loki.name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.loki.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.loki.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.loki.ports.http }}
      targetPort: {{ .Values.loki.ports.http }}
    - name: grpc
      protocol: TCP
      port: {{ .Values.loki.ports.grpc }}
      targetPort: {{ .Values.loki.ports.grpc }}
  selector:
    app: {{ .Values.loki.name }}
  type: {{ .Values.services.type }}
{{- end }}