{{- if .Values.mimir.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.mimir.name }}-config
  namespace: {{ .Values.global.namespace }}
data:
  mimir.yaml: |
    multitenancy_enabled: {{ .Values.mimir.config.multitenancyEnabled }}

    server:
      http_listen_port: {{ .Values.mimir.config.remoteWritePort }}
      grpc_listen_port: {{ .Values.mimir.ports.grpc }}
      log_level: {{ .Values.mimir.config.server.logLevel }}

    # Configuração para servir métricas internas em porta separada
    internal_server:
      enable: true
      http_listen_port: {{ .Values.mimir.config.internalMetricsPort }}

    distributor:
      ring:
        kvstore:
          store: memberlist

    ingester:
      ring:
        kvstore:
          store: memberlist
        replication_factor: {{ .Values.mimir.config.ingester.replicationFactor }}

    store_gateway:
      sharding_ring:
        kvstore:
          store: memberlist

    blocks_storage:
      backend: {{ .Values.mimir.config.storage.backend }}
      filesystem:
        dir: {{ .Values.mimir.config.storage.filesystem.dir }}

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: memberlist

    ruler_storage:
      backend: {{ .Values.mimir.config.storage.backend }}
      filesystem:
        dir: {{ .Values.mimir.config.storage.filesystem.rulerDir }}

    limits:
      max_global_series_per_user: {{ .Values.mimir.config.limits.maxGlobalSeriesPerUser }}
      ingestion_rate: {{ .Values.mimir.config.limits.ingestionRate }}
      out_of_order_time_window: {{ .Values.mimir.config.limits.outOfOrderTimeWindow | default "10m" }}

    usage_stats:
      enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mimir.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.mimir.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.mimir.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.mimir.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mimir.name }}
        {{- with .Values.commonLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: {{ .Values.mimir.name }}
          image: {{ .Values.mimir.image.repository }}:{{ .Values.mimir.image.tag }}
          imagePullPolicy: {{ .Values.mimir.image.pullPolicy }}
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -log.level={{ .Values.mimir.config.server.logLevel }}
          ports:
            - containerPort: {{ .Values.mimir.config.remoteWritePort }}
              name: http
            - containerPort: {{ .Values.mimir.ports.grpc }}
              name: grpc
            - containerPort: 7946
              name: memberlist
          volumeMounts:
            - name: mimir-storage
              mountPath: {{ .Values.mimir.config.storage.filesystem.dir }}
            - name: mimir-ruler-storage
              mountPath: {{ .Values.mimir.config.storage.filesystem.rulerDir }}
            - name: compactor-storage
              mountPath: /data/compactor
            - name: mimir-config
              mountPath: /etc/mimir
              readOnly: true
          resources:
            {{- toYaml .Values.mimir.resources | nindent 12 }}
          env:
            - name: JAEGER_AGENT_HOST
              value: {{ .Values.tempo.name | quote }}
            - name: JAEGER_AGENT_PORT
              value: {{ .Values.tempo.ports.otlpGrpc | quote }}
          {{- if .Values.monitoring.healthChecks.enabled }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.mimir.config.remoteWritePort }}
            {{- toYaml .Values.monitoring.healthChecks.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.mimir.config.remoteWritePort }}
            {{- toYaml .Values.monitoring.healthChecks.livenessProbe | nindent 12 }}
          {{- end }}
      volumes:
        - name: mimir-storage
          emptyDir: {}
        - name: mimir-ruler-storage
          emptyDir: {}
        - name: compactor-storage
          emptyDir: {}
        - name: mimir-config
          configMap:
            name: {{ .Values.mimir.name }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mimir.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Values.mimir.name }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.mimir.config.remoteWritePort }}
      targetPort: {{ .Values.mimir.config.remoteWritePort }}
    - name: metrics
      protocol: TCP
      port: {{ .Values.mimir.config.internalMetricsPort }}
      targetPort: {{ .Values.mimir.config.internalMetricsPort }}
    - name: grpc
      protocol: TCP
      port: {{ .Values.mimir.ports.grpc }}
      targetPort: {{ .Values.mimir.ports.grpc }}
    - name: memberlist
      protocol: TCP
      port: 7946
      targetPort: 7946
  selector:
    app: {{ .Values.mimir.name }}
  type: {{ .Values.services.type }}
{{- end }}